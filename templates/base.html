<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titre %}Data Santé{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="page">
    <div class="topbar"></div>
    <header class="nav">
      <a class="brand" href="{{ url_for('accueil.index') }}">
        <span class="brand-icon" aria-hidden="true"></span>
        <span class="brand-title">DataSanté</span>
      </a>
      <nav class="menu" aria-label="Navigation principale">
        <a href="{{ url_for('accueil.index') }}" class="{% if request.endpoint == 'accueil.index' %}active{% endif %}">Accueil</a>
        <a href="{{ url_for('dashboard.pathologies') }}" class="{% if request.endpoint == 'dashboard.pathologies' %}active{% endif %}">Pathologies</a>
        <a href="{{ url_for('dashboard.honoraires') }}" class="{% if request.endpoint == 'dashboard.honoraires' %}active{% endif %}">Honoraires</a>
        <a href="{{ url_for('dashboard.prescriptions') }}" class="{% if request.endpoint == 'dashboard.prescriptions' %}active{% endif %}">Prescriptions</a>
        <a href="{{ url_for('dashboard.indicateurs') }}" class="{% if request.endpoint == 'dashboard.indicateurs' %}active{% endif %}">Indicateurs</a>
        <a href="{{ url_for('dashboard.comparaisons') }}" class="{% if request.endpoint == 'dashboard.comparaisons' %}active{% endif %}">Comparaisons</a>
        <a href="{{ url_for('dashboard.a_propos') }}" class="{% if request.endpoint == 'dashboard.a_propos' %}active{% endif %}">À propos</a>
      </nav>
    </header>

    {% block contenu %}{% endblock %}

    <footer>
      <div class="footer-content">
        <div class="footer-brand">
          <img class="footer-logo" src="{{ url_for('static', filename='img/upec-iutcv_info-white.png') }}" alt="UPEC - IUT Créteil-Vitry">
        </div>
        <nav class="footer-links" aria-label="Liens de pied de page">
          <a href="{{ url_for('accueil.index') }}">Accueil</a>
          <a href="{{ url_for('dashboard.comparaisons') }}">Comparaisons</a>
          <a href="{{ url_for('dashboard.a_propos') }}">À propos</a>
          <a href="https://data.ameli.fr/" target="_blank" rel="noreferrer">Data Ameli</a>
        </nav>
      </div>
      <div class="footer-copyright">
        © 2026 DataSanté - Données issues de Data Ameli
      </div>
    </footer>
  </div>
  <script src="{{ url_for('static', filename='js/tables.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
